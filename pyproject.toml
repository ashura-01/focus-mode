[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-mode"
version = "1.0.7"
description = "A dark, distraction-fighting focus timer with a knight guardian (PySide6)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["pomodoro", "focus", "productivity", "pyside6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["PySide6>=6.7", "chromadb>=1.0", "reportlab>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
focus-mode = "focus_mode.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
focus_mode = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
